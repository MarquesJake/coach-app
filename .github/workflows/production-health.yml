name: Production Health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production application and identity service
        env:
          APP_BASE_URL: https://coach-app-seven-rose.vercel.app
        run: node scripts/verify-production.mjs
